name: Godot 4.7 CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Run GUT Unit Tests (Headless)
        run: |
          godot --headless -s addons/gut/gut_cmdln.gd -gdir res://test/ -gtest . -gexit

  build:
    name: Build Binaries
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux, windows, macos]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Build Godot Project
        uses: manleydev/build-godot-action@v1.4.1
        with:
          name: my-game-name
          preset: ${{ matrix.platform }}
          debugMode: "false"

      - name: Upload Export Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.platform }}
          path: ${{ github.workspace }}/builds/${{ matrix.platform }}
